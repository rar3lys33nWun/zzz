<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Portfolio Team | NineAsset</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">Nine<span>Asset</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container page-content">
        <h1>Connect with an Advisor</h1>
        <p>Inquire about institutional onboarding and personalized portfolio construction rules below.</p>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Corporate Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="message">Investment Intentions</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">Submit Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 NineAsset. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
